services:
  viewer:
    build: .
    working_dir: /app
    environment:
      PYTHONPYCACHEPREFIX: "/tmp/thelp-python-cache"
      THELP_PORT: "${THELP_PORT:-5448}"
      THELP_WEB_DIR: "/app/www"
      THELP_INDEX_PATH: "/app/www/index.html"
      THELP_DATA_DIR: "/app/data"
      THELP_HELPS_DIR: "/app/data/helps"
      THELP_DOCS_DIR: "/app/data/docs"
      THELP_ASSETS_DIR: "/app/www/assets"
      THELP_README_PATH: "/app/README.md"
      THELP_CHANGELOG_PATH: "/app/CHANGELOG.md"
      THELP_STATE_DIR: "/app/var"
      THELP_SOURCES_DIR: "/app/var/sources"
      THELP_DOWNLOADS_DIR: "/app/var/downloads"
      THELP_MIDI_SOURCES_PATH: "${THELP_MIDI_SOURCES_PATH:-/app/thelpviewer/config/midi-sources.json}"
      THELP_DOS_CONFIG_PATH: "${THELP_DOS_CONFIG_PATH:-/app/thelpviewer/config/dos-prompt.json}"
      # Set on the public host in .env; leave empty for local request URLs.
      THELP_PUBLIC_BASE_URL: "${THELP_PUBLIC_BASE_URL:-}"
      THELP_GOOGLE_SITE_VERIFICATION: "${THELP_GOOGLE_SITE_VERIFICATION:-}"
      # Set separately on the public host; the public URL does not enable Passkeys.
      THELP_AUTH_ORIGIN: "${THELP_AUTH_ORIGIN:-http://localhost:5448}"
      # Passkey bypass is opt-in only via docker-compose.local.yml.
      THELP_DEV_AUTO_LOGIN: "0"
      THELP_HELP_DATABASE_PATH: "/app/thelpviewer/config/help-database.json"
    ports:
      - "${THELP_PORT:-5448}:${THELP_PORT:-5448}"
    volumes:
      - ${THELP_APP_HOST_DIR:-.}:/app
